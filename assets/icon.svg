<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
    <mask id="tag-hole">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <circle cx="256" cy="158" r="19" fill="black"/>
    </mask>
    <g id="flake-axis">
      <line y1="-88" y2="88"/>
      <line x1="-16" y1="-58" x2="0" y2="-40"/>
      <line x1="16" y1="-58" x2="0" y2="-40"/>
      <line x1="-16" y1="58" x2="0" y2="40"/>
      <line x1="16" y1="58" x2="0" y2="40"/>
    </g>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- subtle inner snow dots -->
  <circle cx="88" cy="96" r="10" fill="#ffffff" opacity="0.35"/>
  <circle cx="430" cy="140" r="7" fill="#ffffff" opacity="0.3"/>
  <circle cx="404" cy="420" r="9" fill="#ffffff" opacity="0.3"/>
  <circle cx="92" cy="404" r="6" fill="#ffffff" opacity="0.35"/>

  <g transform="rotate(-16 256 256)">
    <!-- tag shadow -->
    <rect x="152" y="116" width="212" height="308" rx="30" fill="#013a5c" opacity="0.28"
          transform="translate(7 9)"/>
    <!-- label tag with punched hole -->
    <g mask="url(#tag-hole)">
      <rect x="146" y="108" width="220" height="316" rx="30" fill="#ffffff"/>
    </g>
    <circle cx="256" cy="158" r="19" fill="none" stroke="#b3e2f7" stroke-width="6"/>
    <!-- snowflake -->
    <g transform="translate(256 306)" stroke="#0288d1" stroke-width="17"
       stroke-linecap="round" fill="none">
      <use href="#flake-axis"/>
      <use href="#flake-axis" transform="rotate(60)"/>
      <use href="#flake-axis" transform="rotate(120)"/>
      <circle r="13" fill="#0288d1" stroke="none"/>
    </g>
  </g>
</svg>
