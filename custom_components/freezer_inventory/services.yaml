add_item:
  fields:
    freezer_id:
      required: true
      example: main_freezer
      selector:
        text:
    product_id:
      required: false
      example: chicken_breast
      selector:
        text:
    product_name:
      required: false
      example: Kuřecí prsa
      selector:
        text:
    month:
      required: true
      example: 7
      selector:
        number:
          min: 1
          max: 12
          mode: box
    year:
      required: true
      example: 2026
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    weight:
      required: false
      example: 500
      selector:
        number:
          min: 1
          max: 100000
          step: 1
          unit_of_measurement: g
          mode: box
    pieces:
      required: false
      example: 6
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box
    note:
      required: false
      example: Na řízky
      selector:
        text:
    quantity:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box

